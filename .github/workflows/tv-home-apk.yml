name: Build TV Home APK

on:
  push:
    paths:
      - "tcl-tv-home/**"
      - ".github/workflows/tv-home-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build APK
        run: gradle --no-daemon -p tcl-tv-home/android assembleDebug

      - name: Rename APK
        run: cp tcl-tv-home/android/app/build/outputs/apk/debug/app-debug.apk tv-home.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tv-home-apk
          path: tv-home.apk
          if-no-files-found: error
